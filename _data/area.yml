features:
- name: Programmable SMS, MMS, and Voice
  description: CPaaS providers expose programmable APIs for sending and receiving
    SMS and MMS messages, placing and routing voice calls, and managing phone number
    inventory across the global PSTN.
- name: Transactional and Marketing Email
  description: Email APIs handle high-volume transactional sends, marketing campaigns,
    template rendering, list management, and deliverability monitoring through ESP
    infrastructure.
- name: Real-Time Video and Audio
  description: Video and real-time platforms expose APIs and SDKs for embedding live
    video calls, broadcasts, conferences, and low-latency audio rooms into applications.
- name: Push Notifications and In-App Messaging
  description: Push providers deliver native iOS and Android push notifications, web
    push, and in-app messages at scale across FCM, APNs, and proprietary delivery
    infrastructure.
- name: Realtime Chat and Pub/Sub
  description: Realtime APIs provide WebSocket-based pub/sub channels, chat rooms,
    presence, and message history for collaborative and social applications.
- name: Notification Orchestration and Multi-Channel Delivery
  description: Orchestration platforms unify SMS, email, push, chat, and in-app channels
    behind a single API with templating, preference management, and routing logic.
- name: Deliverability and Reputation Management
  description: Deliverability tooling covers IP warmup, SPF/DKIM/DMARC, bounce and
    spam handling, suppression lists, and engagement-based sender reputation analytics.
- name: Number Provisioning and Verification
  description: Communications APIs manage phone number purchase, porting, regulatory
    compliance, and verification flows like one-time passwords and silent network
    auth.
use_cases:
- name: Two-Factor Authentication and OTP Delivery
  description: Applications use SMS, voice, and email APIs to deliver one-time passcodes
    and verification messages for login, signup, and high-risk action confirmation.
- name: Transactional Notifications
  description: Platforms send order confirmations, shipping updates, password resets,
    and account alerts through email, SMS, and push APIs as part of core product workflows.
- name: Customer Engagement Campaigns
  description: Marketing teams orchestrate multi-channel email, SMS, and push campaigns
    using providers like Braze, Iterable, Customer.io, and Klaviyo to drive retention
    and lifecycle messaging.
- name: Live Video and Audio Embeds
  description: Telehealth, education, and collaboration apps embed branded live video
    and audio experiences using Daily.co, Agora, LiveKit, Zoom SDKs, and Dolby.
- name: Contact Center and Programmable Voice
  description: Support and sales teams build programmable IVRs, click-to-call, call
    tracking, and conversational voice flows on Twilio, Vonage, Dialpad, and RingCentral.
- name: Realtime Chat and Social Features
  description: Apps add direct messaging, group chat, presence, and live commenting
    using Sendbird, Stream, PubNub, Ably, and Pusher.
- name: Operational and Incident Alerting
  description: Engineering and SRE teams page on-call staff and broadcast incident
    status via SMS, voice, push, and email through Knock, Courier, and CPaaS providers.
integrations:
- name: Twilio
  description: Leading CPaaS provider offering programmable SMS, MMS, voice, video,
    email (via SendGrid), and verification APIs at global scale.
- name: Vonage
  description: CPaaS platform covering SMS, voice, video, verify, and conversation
    APIs across messaging channels including WhatsApp and Viber.
- name: SendGrid
  description: Transactional and marketing email API owned by Twilio, handling high-volume
    sends, templates, and deliverability.
- name: MessageBird
  description: Omnichannel CPaaS provider (Bird) offering SMS, voice, email, WhatsApp,
    and conversational messaging APIs across global carriers.
- name: Sinch
  description: Global CPaaS platform delivering SMS, voice, email (Mailgun, Mailjet),
    verification, and conversational messaging APIs.
- name: OneSignal
  description: Push notification, in-app messaging, email, and SMS platform with a
    unified messaging API used by mobile and web applications.
- name: Sendbird
  description: In-app chat, messaging, and calls API powering customer support and
    social experiences inside mobile and web applications.
- name: Daily.co
  description: WebRTC-based video and audio API for embedding live calls, broadcasts,
    and recording into web and mobile applications.
- name: Mailgun
  description: Transactional email and email validation API focused on deliverability
    for developers and high-volume senders.
